site_name: PC Praktikum S1
site_description: Quantum Chemistry on the Computer
site_url: https://tilenlindic-maker.github.io/PC-Praktikum-S1/

docs_dir: S1_files

theme:
  name: material
  palette:
    primary: blue
    accent: blue
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search

hooks:
  - obsidian_links.py

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
